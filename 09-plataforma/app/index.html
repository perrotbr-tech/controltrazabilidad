<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Trazabilidad de Transporte</title>
<style>
:root{
  color-scheme: light only;
  --fondo:#EEF1F3; --panel:#FFFFFF; --tinta:#16202A; --gris:#55636E; --linea:#D5DBE0;
  --ambar:#E29A0C; --ambar-osc:#8A5E00; --ambar-suave:#FCEFD2;
  --verde:#186B3D; --verde-suave:#E0EFE6; --rojo:#A32E24; --rojo-suave:#F6E2DF;
  --azul:#25577E; --azul-suave:#E1EAF2; --suave:#F5F7F8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--fondo);color:var(--tinta)}
body{font-family:system-ui,'Segoe UI',Roboto,sans-serif;font-size:14.5px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:9px 14px;background:var(--tinta);color:#FFFFFF}
button.sec{background:#FFFFFF;color:var(--tinta);border:1.5px solid var(--linea)}
button.ok{background:var(--verde);color:#FFFFFF} button.no{background:var(--rojo);color:#FFFFFF}
button.amb{background:var(--ambar);color:#26200E;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;padding:9px 10px;border:1.5px solid var(--linea);border-radius:8px;background:#FFFFFF;color:var(--tinta);width:100%}
label{font-size:12.5px;color:var(--gris);display:block;margin:9px 0 4px}
h1{font-size:20px;font-weight:700;color:var(--tinta)} h2{font-size:16.5px;font-weight:700;color:var(--tinta)} h3{font-size:14.5px;font-weight:700;color:var(--tinta)}
p,td,th,div,span,li{color:inherit}
.sub{color:var(--gris);font-size:13px}

.topbar{background:var(--tinta);color:#FFFFFF;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar *{color:#FFFFFF}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo .ruta{width:32px;height:9px;border-radius:6px;background:linear-gradient(90deg,var(--ambar) 0 26%,#FFFFFF 26% 37%,var(--ambar) 37% 63%,#FFFFFF 63% 74%,var(--ambar) 74%);flex:0 0 auto}
.logo b{font-size:15.5px}
.usuario{margin-left:auto;text-align:right;font-size:12.5px;line-height:1.35;min-width:0}
.usuario b{font-size:13.5px}
.demo-flag{background:var(--ambar);color:#26200E !important;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;letter-spacing:.3px}
.demo-flag *{color:#26200E !important}

/* Navegación móvil: horizontal desplazable, activa siempre visible */
.nav{display:flex;gap:6px;padding:9px 14px;background:#FFFFFF;border-bottom:1.5px solid var(--linea);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:sticky;top:0;z-index:5}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;color:var(--gris);padding:8px 13px;border-radius:8px;font-size:13.5px;white-space:nowrap;flex:0 0 auto}
.nav button.activo{background:var(--tinta);color:#FFFFFF;font-weight:700}
.cont{max-width:1000px;margin:0 auto;padding:16px 14px 60px}
@media(min-width:700px){.cont{padding:20px 22px 60px}.nav{padding:10px 22px}.topbar{padding:14px 22px}}

.tarjeta{background:var(--panel);border:1.5px solid var(--linea);border-radius:12px;padding:15px 16px;margin-bottom:13px}
.fila{display:flex;gap:13px;flex-wrap:wrap} .fila>*{flex:1;min-width:190px}
.grid2{display:grid;grid-template-columns:1fr;gap:13px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--gris);font-weight:700;font-size:11.5px;padding:7px 8px;border-bottom:1.5px solid var(--linea);background:#FFFFFF}
td{padding:8px;border-bottom:1px solid var(--linea);vertical-align:top;color:var(--tinta)}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}

.kpi{font-size:23px;font-weight:800;line-height:1.15;color:var(--tinta)}
.kpi small{font-size:12px;font-weight:500;color:var(--gris);display:block;margin-top:3px}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.c-gris{background:var(--suave);color:var(--gris);border:1px solid var(--linea)}
.c-ambar{background:var(--ambar-suave);color:var(--ambar-osc)}
.c-verde{background:var(--verde-suave);color:var(--verde)}
.c-rojo{background:var(--rojo-suave);color:var(--rojo)}
.c-azul{background:var(--azul-suave);color:var(--azul)}

.advertencia{background:var(--ambar-suave);border:1.5px solid #E8CF9A;border-radius:10px;padding:10px 13px;font-size:12.5px;color:#5C4405;margin-bottom:13px}
.advertencia b{display:block;margin-bottom:2px;color:#5C4405}
.aviso-mvp{background:var(--azul-suave);border:1.5px solid #B9CDDE;border-radius:10px;padding:10px 13px;font-size:12.5px;color:#1B415F;margin-bottom:13px}

.barra{height:9px;border-radius:6px;background:var(--linea);overflow:hidden;display:flex;margin-top:6px}
.barra i{display:block;height:100%}
.barra .b-conf{background:var(--verde)} .barra .b-esp{background:var(--rojo)} .barra .b-extra{background:var(--ambar)}

.linea-estados{display:flex;align-items:flex-start;margin:10px 0 4px;overflow-x:auto;padding-bottom:4px}
.parada{display:flex;flex-direction:column;align-items:center;min-width:82px;position:relative;font-size:10.5px;color:var(--gris);text-align:center}
.parada .punto{width:14px;height:14px;border-radius:50%;background:#FFFFFF;border:3px solid var(--linea);z-index:2}
.parada:not(:last-child)::after{content:"";position:absolute;top:5.5px;left:50%;width:100%;height:3px;background:var(--linea);z-index:1}
.parada.hecha .punto{border-color:var(--ambar);background:var(--ambar)}
.parada.hecha:not(:last-child)::after{background:var(--ambar)}
.parada.mala .punto{border-color:var(--rojo);background:var(--rojo)}
.parada span{margin-top:5px;max-width:80px}

.vacio{color:var(--gris);text-align:center;padding:24px 10px;font-size:13.5px}
.aud{font-size:12px;color:var(--gris);border-left:3px solid var(--linea);padding:4px 10px;margin:5px 0}
.aud.denegado{border-left-color:var(--rojo);color:var(--rojo)}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 14px;background:var(--tinta)}
.login{background:#FFFFFF;border-radius:14px;padding:24px 20px;max-width:430px;width:100%}
.login h1{margin-bottom:4px}
.cuenta{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#FFFFFF;color:var(--tinta);
  border:1.5px solid var(--linea);border-radius:10px;padding:11px 13px;margin-top:9px}
.cuenta:hover{border-color:var(--ambar)}
.cuenta .ini{width:34px;height:34px;border-radius:50%;background:var(--suave);color:var(--tinta);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto}
.cuenta small{display:block;color:var(--gris);font-size:12px}

.velo{position:fixed;inset:0;background:rgba(22,32,42,.6);display:none;align-items:flex-start;justify-content:center;padding:26px 12px;overflow:auto;z-index:50}
.velo.abierto{display:flex}
.modal{background:#FFFFFF;border-radius:12px;max-width:620px;width:100%;padding:20px}
.doc{background:#FFFFFF;border:1.5px solid var(--linea);border-radius:10px;padding:20px;font-size:13.5px}
.doc .cab{border-bottom:3px solid var(--tinta);padding-bottom:10px;margin-bottom:12px}
.doc .correl{font-size:18px;font-weight:800}
.tot{background:var(--suave);font-weight:800}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
</style>
</head>
<body>
<div id="raiz"></div>
<div class="velo" id="velo"><div class="modal" id="modal"></div></div>

<script>
/* =========================================================================
   TRAZABILIDAD DE TRANSPORTE — MVP v2
   Nota de arquitectura: este MVP corre 100% en el navegador. Las reglas de
   autorización están CENTRALIZADAS en requirePermission() para que la
   migración a backend sea conectar, no rediseñar. La validación real de
   servidor pertenece a la fase 2 (ver aviso en la interfaz).
   Copia de trabajo — SPEC-002 aplicada (permisos en todas las mutaciones).
   SPEC-003 aplicada (capacidad 15 por van, 2 vans extra) · SPEC-003b/DEC-032: 8 salidas (23:00…06:45), demanda H-023, tope de extras por jornada.
   SPEC-CORTE-1: inscripción híbrida T−48/T−2 (simulación en navegador — no es seguridad ni concurrencia de producción).
   ========================================================================= */
const KEY='trazabilidad_v4';   // DEC-032 / Corte 1: invalida semilla de 7 salidas (v3)
let RELOJ_SERVIDOR=new Date('2026-09-15T18:30:00');
function ahora(){return new Date(RELOJ_SERVIDOR.getTime());}
function setRelojServidor(iso){RELOJ_SERVIDOR=new Date(iso);}
const MES='2026-09';
const DEMO = !location.search.includes('prod=1');   // en producción: variable de entorno
const CIERRE_MIN=60;                                 // reservas cierran 60 min antes
let S=null;                                          // estado; se asigna tras semilla/cargar

const fmt$=v=>v==null?'—':'$'+Math.round(v).toLocaleString('es-CL');
const fmtN=v=>v==null?'—':(''+(Math.round(v*10)/10)).replace('.',',');
const div=(a,b)=>(!b||b===0)?null:a/b;
/* AC-C1-17: escapar texto de usuario antes de innerHTML */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dt=s=>new Date(s);
const fecha=s=>{const d=dt(s);return d.getDate()+' de '+MESES[d.getMonth()];};
const hora=s=>{const d=dt(s);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const dISO=d=>{const x=dt(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};

/* --- Jornada: ancla = primera salida del contrato (T0, p.ej. 23:00); madrugada pertenece al día anterior --- */
function jornadaDe(salidaISO){
  const d=dt(salidaISO); const ini=new Date(d);
  const first=(S&&S.contrato&&S.contrato.salidas&&S.contrato.salidas[0])||[23,0];
  const t0Hour=first[0], t0Min=first[1]||0;
  if(d.getHours()<t0Hour || (d.getHours()===t0Hour && d.getMinutes()<t0Min)) ini.setDate(ini.getDate()-1);
  ini.setHours(t0Hour,t0Min,0,0);
  const fin=new Date(ini); fin.setDate(fin.getDate()+1);
  return {inicio:ini, fin, id:dISO(ini),
    etiqueta:'Jornada nocturna '+ini.getDate()+'–'+fin.getDate()+' de '+MESES[fin.getMonth()]};
}
function t0Jornada(jornadaId){
  const [y,m,d]=jornadaId.split('-').map(Number);
  const first=(S.contrato.salidas&&S.contrato.salidas[0])||[23,0];
  return new Date(y,m-1,d,first[0],first[1],0,0);
}
function ventanaJornada(jornadaId, opts){
  const t0 = opts&&opts.t0Override ? new Date(opts.t0Override) : t0Jornada(jornadaId);
  const apH=S.contrato.aperturaHorasAntes||48;
  const blH=S.contrato.bloqueoHorasAntes||2;
  const apertura=new Date(t0.getTime()-apH*3600000);
  const bloqueo=new Date(t0.getTime()-blH*3600000);
  const now=ahora();
  let estado='ABIERTA', permiteMutacion=true;
  if(now < apertura){estado='CERRADO_ANTES'; permiteMutacion=false;}
  else if(now >= bloqueo){estado='BLOQUEADO_POR_CIERRE'; permiteMutacion=false;}
  return {apertura:apertura.toISOString(), bloqueo:bloqueo.toISOString(), t0:t0.toISOString(), estado, permiteMutacion};
}

/* ================== SEMILLA: users, organizations, role_assignments ================== */
function semilla(){
  const RUTAS=[
   {id:0,nombre:'Ruta Norte',vans:2,ciclo:'~50 min',
    paradas:[['Estadio Regional (Av. Angamos)',5],['Mallplaza / Av. Balmaceda',11],['Plaza Colón — Centro',15],['Terminal de Buses',22],['Hospital Regional (Av. Azapa)',26],['Sector Bonilla — Feria',32]]},
   {id:1,nombre:'Ruta Sur',vans:2,ciclo:'~30 min',
    paradas:[['Av. Angamos alto',4],['Universidad de Antofagasta — Coloso',8],['Jardines del Sur',14]]}];
  const S={
   organizations:[
    {id:1,nombre:'Hotel Enjoy Antofagasta',tipo:'MANDANTE'},
    {id:2,nombre:'Transportes del Desierto SpA',tipo:'CONTRATISTA'}],
   users:[
    {id:1,nombre:'Camila Fuentes',identificador:'EMP-0142',email:'c.fuentes@enjoy.cl',orgId:1,activo:true},
    {id:2,nombre:'Rodrigo Salas',identificador:'OPE-0031',email:'r.salas@tdesierto.cl',orgId:2,activo:true},
    {id:3,nombre:'Patricia Molina',identificador:'SUP-0007',email:'p.molina@enjoy.cl',orgId:1,activo:true},
    {id:4,nombre:'Administración TT',identificador:'ADM-0001',email:'admin@trazabilidad.cl',orgId:1,activo:true},
    {id:5,nombre:'Ex Trabajador',identificador:'EMP-0099',email:'inactivo@enjoy.cl',orgId:1,activo:false}],
   role_assignments:[
    {id:1,userId:1,orgId:1,rol:'TRABAJADOR',contratoId:1,activo:true,fecha:'2026-01-05',asignadoPor:4},
    {id:2,userId:2,orgId:2,rol:'CONTRATISTA',contratoId:1,activo:true,fecha:'2026-01-05',asignadoPor:4},
    {id:3,userId:3,orgId:1,rol:'MANDANTE',contratoId:1,activo:true,fecha:'2026-01-05',asignadoPor:4},
    {id:4,userId:4,orgId:1,rol:'ADMINISTRADOR',contratoId:null,activo:true,fecha:'2026-01-01',asignadoPor:4},
    {id:5,userId:4,orgId:1,rol:'MANDANTE',contratoId:1,activo:true,fecha:'2026-02-10',asignadoPor:4},
    {id:6,userId:5,orgId:1,rol:'TRABAJADOR',contratoId:1,activo:false,fecha:'2026-01-05',asignadoPor:4}],
   sesion:null, contexto:null, vista:null,
   contrato:{id:1,mandanteOrg:1,contratistaOrg:2,inicio:'2026-01-01',termino:'2026-12-31',
     montoFijo:18500000, reglaDevengo:null,   // sin regla de devengo definida
     capacidadVan:15, vehiculos:4, vansExtraDisponibles:2, rutas:RUTAS,   // SPEC-003: 15 cupos garantizados por van; 2 vans extra completas a disposición
     origen:'Hotel Enjoy Antofagasta — Av. Angamos 01455',
     frecuencias:'8 salidas por jornada desde el Enjoy según fin de turno (DEC-032); las vans recorren su ruta y regresan al hotel dentro del ciclo',
     salidasPorJornada:8, salidas:[[23,0],[0,15],[1,35],[2,35],[3,35],[4,35],[5,35],[6,45]],   // DEC-032: 23:00 reservable + 00:15…06:45
     aperturaHorasAntes:48, bloqueoHorasAntes:2,
     modoInscripcion:'PROPUESTA_REQUIERE_CONFIRMACION',
     horarios:'Salidas a las 23:00, 00:15, 01:35, 02:35, 03:35, 04:35, 05:35 y 06:45 (8 por jornada, por ruta — DEC-032); T0=23:00 ancla y primera salida real · ida (hotel → casas) y vuelta (casas → hotel)',
     sentido:'Ida y vuelta en cada ciclo horario; puntos de bajada y de encuentro por definir con la planilla de trabajadores (SPEC-004)',
     tiposVehiculo:'Van de pasajeros — 15 a 17 cupos por van (15 garantizados) · 4 vans en proyección, 2 por ruta', dotacion:394,
     reajuste:'IPC semestral (informativo — el monto reajustado se ingresa con trazabilidad)',
     extrasPermitidos:true, tarifaExtra:45000,
     requisitosExtra:'Demanda confirmada sobre los cupos de la salida, o contingencia operacional con evidencia',
     codigoConciliacion:'CT-2026', estado:'Vigente'},
   servicios:[], reservas:[], extras:[], auditoria:[], conciliaciones:[], manifiestos:[], excepciones:[], notificaciones:[]};

  const CAP=S.contrato.capacidadVan;   // SPEC-003 REQ-010: única fuente de la capacidad por van
  // DEC-032 + H-023: demanda media por salida (23:00 + semana real) y factor por día de inicio de jornada
  const BASE_SALIDA=[40,55,24,22,23,25,13,35];             // 23:00 · 00:15 · 01:35 · 02:35 · 03:35 · 04:35 · 05:35 · 06:45
  const FACTOR_DIA=[0.7,0.8,0.9,1.0,1.2,1.4,1.4];            // domingo … sábado (jornada = noche que empieza ese día)
  const perfil=(idx,ri,dow)=>Math.round(BASE_SALIDA[idx]*FACTOR_DIA[dow]*(ri===0?0.6:0.4));
  let sid=0,rid=0;
  for(let jDay=9;jDay<=15;jDay++){
    S.contrato.salidas.forEach(([hh,mm],idx)=>{
      const salida=new Date(2026,8,jDay,hh,mm,0);
      if(hh<12) salida.setDate(salida.getDate()+1); // madrugada pertenece a jornada jDay
      const dow=new Date(2026,8,jDay).getDay();
      if(salida>new Date(2026,8,16,7,0,0)) return;
      RUTAS.forEach((R,ri)=>{
        sid++;
        const cierre=new Date(salida.getTime()-CIERRE_MIN*60000);
        const svc={id:sid,rutaIdx:ri,ruta:R.nombre,salida:salida.toISOString(),cierre:cierre.toISOString(),
          capacidadBase:R.vans*CAP,capacidadExtra:0,vans:R.vans,ejecutado:salida<ahora()};
        S.servicios.push(svc);
        let n=perfil(idx,ri,dow);
        if(jDay===12&&idx===1&&ri===0) n=56; // extra #1: sábado 12 → 00:15 del 13, 56 solicitudes / 30 cupos
        if(jDay===15&&idx===1&&ri===0) n=34; // espera futura: 00:15 del 16
        if(jDay===11&&idx===6&&ri===0) n=11; // Rechazado: 05:35 del 12, demanda bajo cupo
        for(let k=0;k<n;k++){ rid++;
          const p=R.paradas[k%R.paradas.length];
          S.reservas.push({id:rid,servicioId:sid,userId:((rid%299)+2),   // QA D-3: 2..300, nunca el userId 1 (Camila), que se asigna aparte
            nombre:'Trabajador '+String((rid%300)+1).padStart(3,'0'),
            parada:p[0],offset:p[1],creada:new Date(salida.getTime()-(6+k)*3600000).toISOString(),
            estado:'confirmada'});
        }
      });
    });
  }
  // las reservas de Camila (userId 1) en servicios futuros de Ruta Norte
  const futuroN=S.servicios.filter(s=>!s.ejecutado&&s.rutaIdx===0).slice(0,3);
  futuroN.forEach((s,i)=>{ const r=S.reservas.find(r=>r.servicioId===s.id); if(r){r.userId=1;r.nombre='Camila Fuentes';} });
  S.extras=[
   {id:1,servicioId:S.servicios.find(s=>s.rutaIdx===0&&dt(s.salida).getDate()===13&&dt(s.salida).getHours()===0).id,
    motivo:'Reservas (56) superan los 30 cupos de la salida — servicio prestado de madrugada, gestión presentada al día siguiente (DEC-009)',tipo:'cuantitativa',vans:2,capacidadExtra:2*CAP,tarifa:90000,
    estado:'Utilizado',solicitadoPor:2,fechaSolicitud:'2026-09-13T09:30:00',autorizadoPor:3,fechaAutorizacion:'2026-09-13T11:10:00',
    motivoAutorizacion:'Validación ex post: demanda confirmada sobre capacidad (DEC-009)',evidencia:{patente:true,salida:true,manifiesto:true},
    pasajerosExtra:26,reclasificacion:null},
   {id:2,servicioId:S.servicios.find(s=>s.rutaIdx===1&&dt(s.salida).getDate()===11&&dt(s.salida).getHours()===6).id,   // 06:45
    motivo:'Falla mecánica de una van al iniciar el recorrido',tipo:'operacional',vans:1,capacidadExtra:CAP,tarifa:45000,
    estado:'Observado',solicitadoPor:2,fechaSolicitud:'2026-09-11T06:50:00',autorizadoPor:null,fechaAutorizacion:null,
    motivoAutorizacion:null,evidencia:{patente:true,salida:false,manifiesto:false},pasajerosExtra:11,reclasificacion:null,
    observacion:'Sin autorización previa; emergencia pendiente de validación y evidencia incompleta'},
   {id:3,servicioId:S.servicios.find(s=>s.rutaIdx===0&&dt(s.salida).getDate()===12&&dt(s.salida).getHours()===5).id,   // 05:35
    motivo:'Refuerzo preventivo por posible alta demanda',tipo:'cuantitativa',vans:1,capacidadExtra:CAP,tarifa:45000,
    estado:'Rechazado',solicitadoPor:2,fechaSolicitud:'2026-09-12T05:05:00',autorizadoPor:3,fechaAutorizacion:'2026-09-12T05:20:00',
    motivoAutorizacion:'Reservas (11) no superan los 30 cupos y sin contingencia acreditada',
    evidencia:{patente:false,salida:false,manifiesto:false},pasajerosExtra:0,reclasificacion:null}];
  // QA D-2: el extra #1 fue autorizado y utilizado, por lo que su salida ya tiene la capacidad ampliada
  { const s1=S.servicios.find(s=>s.id===S.extras[0].servicioId); s1.capacidadExtra=S.extras[0].capacidadExtra; }
  S.auditoria=[
   {fecha:'2026-09-13T11:10:00',usuario:'Patricia Molina',rol:'MANDANTE',accion:'Capacidad ampliada por extra #1',detalle:'Ruta Norte 00:15 — capacidad 30 → 60',anterior:'capacidad 30'},

/* ================== CAPACIDAD Y LISTA DE ESPERA ================== */
function capacidadTotal(svc){return svc.capacidadBase+svc.capacidadExtra;}
function ocupaCupo(r){
  return r&&['CONFIRMADO','confirmada','EN_ESPERA','espera'].includes(r.estado);
}
function recalcular(St,svc){
  // Solo reasigna entre ocupantes de cupo del mismo servicio (salida+ruta+sentido); FIFO por creada.
  // DEC-033: EN_ESPERA promovido → CONFIRMADO; nunca supera capacidad.
  const rs=St.reservas.filter(r=>r.servicioId===svc.id&&ocupaCupo(r))
    .sort((a,b)=>a.creada<b.creada?-1:1);
  const cap=capacidadTotal(svc); const promovidos=[];
  rs.forEach((r,i)=>{
    if(i<cap){
      const eraEspera=r.estado==='espera'||r.estado==='EN_ESPERA';
      if(eraEspera){ promovidos.push(r); r.estado='CONFIRMADO'; }
      else if(r.estado!=='CONFIRMADO'&&r.estado!=='confirmada') r.estado='CONFIRMADO';
    } else {
      r.estado=(r.estado==='CONFIRMADO'||r.estado==='confirmada'||r.estado==='EN_ESPERA')?'EN_ESPERA':'espera';
    }
  });
  return promovidos;
}
function notificarSimulada(tipo,detalle,userId,servicioId,reservaId){
  if(!S.notificaciones) S.notificaciones=[];
  const id=Math.max(0,...S.notificaciones.map(n=>n.id),0)+1;
  S.notificaciones.unshift({id,tipo,detalle:detalle||'',userId,servicioId,reservaId,fecha:ahora().toISOString(),simulada:true});
}
function paradaEnRuta(paradaNombre,rutaIdx){
  const R=S.contrato.rutas.find(x=>x.id===rutaIdx)||S.contrato.rutas[rutaIdx];
  if(!R||paradaNombre==null) return null;
  return R.paradas.find(p=>p[0]===paradaNombre)||null;
}
function opcionesCambioInscripcion(reservaId){
  const r0=S.reservas.find(x=>x.id===reservaId);
  if(!r0) return [];
  const svc0=S.servicios.find(s=>s.id===r0.servicioId);
  if(!svc0) return [];
  const jid=r0.jornadaId||jornadaDe(svc0.salida).id;
  // Todas las rutas configuradas/habilitadas de la jornada (DEC-033: no fijar solo Norte).
  return S.servicios.filter(s=>!s.ejecutado&&s.id!==r0.servicioId&&jornadaDe(s.salida).id===jid
    &&S.contrato.rutas.some(R=>R.id===s.rutaIdx));
}
function recalcularTodo(St){St.servicios.forEach(s=>recalcular(St,s));}
function demanda(svc){
  const rs=S.reservas.filter(r=>r.servicioId===svc.id&&ocupaCupo(r));
  const conf=rs.filter(r=>r.estado==='confirmada'||r.estado==='CONFIRMADO').length;
  const esp=rs.filter(r=>r.estado==='espera'||r.estado==='EN_ESPERA').length;
  const cap=capacidadTotal(svc);
  return {solicitudes:rs.length,confirmadas:conf,espera:esp,capacidadBase:svc.capacidadBase,
    capacidadExtra:svc.capacidadExtra,capacidad:cap,deficit:Math.max(rs.length-cap,0),
    libres:Math.max(cap-conf,0),
    estado: rs.length>cap?'Requiere capacidad adicional':(rs.length===cap?'Capacidad completa':'Capacidad disponible')};
}
function nivelJustificacion(svc){
  const D=demanda(svc);
  if(D.solicitudes>D.capacidad) return {nivel:'Necesidad cuantitativa',clase:'c-verde',auto:true};
  if(D.solicitudes===D.capacidad) return {nivel:'Capacidad completa',clase:'c-ambar',auto:false};
  return {nivel:'No requerido por capacidad',clase:'c-gris',auto:false};
}
function reservaAbierta(svc){
  if(!(ahora() < dt(svc.cierre))) return false;
  const v=ventanaJornada(jornadaDe(svc.salida).id);
  return v.estado==='ABIERTA' && v.permiteMutacion;
}

/* ================== CORTE 1 — inscripción híbrida (simulación) ================== */
function precargarPropuesta({userId,servicioId,parada,offset,jornadaId}){
  if(!requirePermission('crear:reserva',{tipo:'reserva',userId})) return {ok:false,error:'NO_AUTORIZADO'};
  const svc=S.servicios.find(s=>s.id===servicioId);
  if(!svc) return {ok:false,error:'SERVICIO'};
  const jid=jornadaId||jornadaDe(svc.salida).id;
  const v=ventanaJornada(jid);
  if(v.estado!=='ABIERTA'||!v.permiteMutacion){
    audita('BLOQUEADO_POR_CIERRE','Precarga rechazada — jornada '+jid+' estado '+v.estado,'');
    return {ok:false,error:'BLOQUEADO_POR_CIERRE'};
  }
  let r=S.reservas.find(x=>x.userId===userId&&x.jornadaId===jid&&x.estado==='PROPUESTO');
  const u=S.users.find(x=>x.id===userId);
  if(r){
    const ant=r.servicioId;
    r.servicioId=servicioId; r.parada=parada; r.offset=offset;
    r.versionPropuesta=(r.versionPropuesta||1)+1;
    audita('Propuesta actualizada','jornada '+jid+' · svc '+servicioId+' · v'+r.versionPropuesta,'svc '+ant);
    guardar(); return r;
  }
  const id=Math.max(0,...S.reservas.map(x=>x.id))+1;
  r={id,servicioId,userId,nombre:u?u.nombre:'',parada,offset,
    creada:ahora().toISOString(),estado:'PROPUESTO',jornadaId:jid,versionPropuesta:1};
  S.reservas.push(r);
  audita('Propuesta precargada','jornada '+jid+' · '+hora(svc.salida)+' · '+parada,'');
  guardar(); return r;
}
function confirmarInscripcion(id){
  const r=S.reservas.find(x=>x.id===id);
  if(!r) return {ok:false,error:'NO_ENCONTRADA'};
  if(!requirePermission('crear:reserva',{tipo:'reserva',userId:r.userId})) return {ok:false,error:'NO_AUTORIZADO'};
  const svc=S.servicios.find(s=>s.id===r.servicioId);
  const jid=r.jornadaId||jornadaDe(svc.salida).id;
  const v=ventanaJornada(jid);
  if(v.estado!=='ABIERTA'||!v.permiteMutacion){
    audita('BLOQUEADO_POR_CIERRE','Confirmación rechazada — jornada '+jid+' estado '+v.estado,'PROPUESTO');
    return {ok:false,error:'BLOQUEADO_POR_CIERRE'};
  }
  const D=demanda(svc);
  const ant=r.estado;
  r.estado=D.libres>0?'CONFIRMADO':'EN_ESPERA';
  audita('Inscripción confirmada',svc.ruta+' '+hora(svc.salida)+' · '+r.estado,ant);
  guardar(); return {ok:true,reserva:r};
}
function cambiarInscripcion(id, nuevoServicioId, opts){
  const r=S.reservas.find(x=>x.id===id);
  if(!r) return {ok:false,error:'NO_ENCONTRADA'};
  if(!requirePermission('crear:reserva',{tipo:'reserva',userId:r.userId})) return {ok:false,error:'NO_AUTORIZADO'};
  const oldSvc=S.servicios.find(s=>s.id===r.servicioId);
  const nuevo=S.servicios.find(s=>s.id===nuevoServicioId);
  if(!nuevo) return {ok:false,error:'SERVICIO'};
  const jid=r.jornadaId||jornadaDe(oldSvc.salida).id;
  const v=ventanaJornada(jid);
  if(v.estado!=='ABIERTA'||!v.permiteMutacion){
    audita('BLOQUEADO_POR_CIERRE','Cambio rechazado — jornada '+jid,'svc '+r.servicioId);
    return {ok:false,error:'BLOQUEADO_POR_CIERRE'};
  }
  // DEC-033: validar parada antes de cupo — conservar si válida; si no, exigir selección (nunca 1ª silenciosa).
  let nuevaParada=r.parada, nuevoOffset=r.offset;
  if(opts&&opts.parada!=null){
    const m=paradaEnRuta(opts.parada,nuevo.rutaIdx);
    if(!m) return {ok:false,error:'PARADA_INVALIDA'};
    nuevaParada=m[0];
    nuevoOffset=(opts.offset!=null)?opts.offset:m[1];
  } else {
    const m=paradaEnRuta(r.parada,nuevo.rutaIdx);
    if(!m) return {ok:false,error:'PARADA_REQUERIDA'};
    nuevaParada=m[0];
    nuevoOffset=r.offset;
  }
  const D=demanda(nuevo);
  const aceptaEspera=opts&&opts.aceptaEspera;
  const eraConfirmado=r.estado==='CONFIRMADO'||r.estado==='confirmada';
  if(eraConfirmado&&D.libres<=0&&!aceptaEspera){
    audita('Cambio revertido','Sin cupo en destino '+nuevoServicioId,'svc '+r.servicioId);
    return {ok:false,error:'SIN_CUPO'};
  }
  const oldId=r.servicioId;
  r.servicioId=nuevoServicioId;
  r.parada=nuevaParada;
  r.offset=nuevoOffset;
  if(eraConfirmado){
    if(D.libres<=0&&aceptaEspera) r.estado='EN_ESPERA';
    else r.estado='CONFIRMADO';
  }
  recalcular(S,oldSvc);
  recalcular(S,nuevo);
  audita('Inscripción cambiada','svc '+oldId+' → '+nuevoServicioId+' · '+r.estado,'svc '+oldId);
  guardar(); return {ok:true,reserva:r};
}
function rechazarInscripcion(id){
  const r=S.reservas.find(x=>x.id===id);
  if(!r) return {ok:false,error:'NO_ENCONTRADA'};
  if(!requirePermission('cancelar:reserva-propia',{tipo:'reserva',userId:r.userId})) return {ok:false,error:'NO_AUTORIZADO'};
  const svc=S.servicios.find(s=>s.id===r.servicioId);
  const jid=r.jornadaId||(svc&&jornadaDe(svc.salida).id);
  if(jid){
    const v=ventanaJornada(jid);
    if(v.estado!=='ABIERTA'||!v.permiteMutacion){
      audita('BLOQUEADO_POR_CIERRE','Rechazo/declinación bloqueada — jornada '+jid,r.estado);
      return {ok:false,error:'BLOQUEADO_POR_CIERRE'};
    }
  }
  const ant=r.estado;
  r.estado='DECLINADO';
  let promovidos=[];
  if(svc) promovidos=recalcular(S,svc);
  audita('Inscripción declinada — cupo liberado',
    (svc?svc.ruta+' '+hora(svc.salida):'')+' · desde '+ant,
    '→ DECLINADO');
  notificarSimulada('LIBERACION_CUPO',
    'Cupo liberado por declinación'+(svc?' · '+svc.ruta+' '+hora(svc.salida):''),
    r.userId, r.servicioId, r.id);
  if(promovidos.length){
    const detalle=promovidos.map(p=>'#'+p.id+' '+p.nombre).join(', ');
    audita('Promoción lista de espera',
      (svc?svc.ruta+' '+hora(svc.salida)+' · ':'')+detalle+' → CONFIRMADO',
      'EN_ESPERA');
    promovidos.forEach(p=>notificarSimulada('PROMOCION_ESPERA',
      'Pasaste de lista de espera a CONFIRMADO'+(svc?' · '+svc.ruta+' '+hora(svc.salida):''),
      p.userId, p.servicioId, p.id));
  }
  guardar(); return {ok:true,reserva:r,promovidos};
}
function aplicarCierreJornada(jornadaId){
  const afectadas=S.reservas.filter(r=>{
    if(r.estado!=='PROPUESTO') return false;
    if(r.jornadaId===jornadaId) return true;
    const svc=S.servicios.find(s=>s.id===r.servicioId);
    return svc&&jornadaDe(svc.salida).id===jornadaId;
  });
  afectadas.forEach(r=>{ r.estado='FUERA_MANIFIESTO'; });
  const confirmados=S.reservas.filter(r=>{
    if(!(r.estado==='CONFIRMADO'||r.estado==='confirmada')) return false;
    const svc=S.servicios.find(s=>s.id===r.servicioId);
    return svc&&jornadaDe(svc.salida).id===jornadaId;
  });
  if(!S.manifiestos) S.manifiestos=[];
  const version=(S.manifiestos.filter(m=>m.jornadaId===jornadaId).length)+1;
  const ids=confirmados.map(r=>r.id);
  const payload=JSON.stringify({jornadaId,ids,version});
  let h=0; for(let i=0;i<payload.length;i++) h=((h<<5)-h)+payload.charCodeAt(i)|0;
  const snap={jornadaId,version,hash:'M'+Math.abs(h).toString(16),confirmados:ids,
    conteos:{confirmados:ids.length,fueraManifiesto:afectadas.length,espera:S.reservas.filter(r=>{
      const svc=S.servicios.find(s=>s.id===r.servicioId);
      return svc&&jornadaDe(svc.salida).id===jornadaId&&(r.estado==='espera'||r.estado==='EN_ESPERA');
    }).length},fecha:ahora().toISOString()};
  S.manifiestos.push(snap);
  audita('Cierre de jornada','Manifiesto '+jornadaId+' v'+version+' · confirmados '+ids.length+' · fuera '+afectadas.length,'ABIERTA');
  guardar(); return snap;
}

function chipEstadoReserva(est){
  if(est==='CONFIRMADO'||est==='confirmada') return {cls:'c-verde',txt:est==='CONFIRMADO'?'Confirmado':'Reserva confirmada'};
  if(est==='PROPUESTO') return {cls:'c-azul',txt:'Propuesto — pendiente de confirmar'};
  if(est==='EN_ESPERA'||est==='espera') return {cls:'c-ambar',txt:'En espera de vehículo adicional'};
  if(est==='DECLINADO') return {cls:'c-gris',txt:'No viajaré'};
  if(est==='FUERA_MANIFIESTO'||est==='BLOQUEADO_SIN_CONFIRMAR') return {cls:'c-rojo',txt:'Sin confirmar al cierre'};
  return {cls:'c-gris',txt:est||'—'};
}
function cuentaRegresivaBloqueo(jornadaId){
  const v=ventanaJornada(jornadaId);
  const bl=dt(v.bloqueo); const ms=bl.getTime()-ahora().getTime();
  if(ms<=0) return 'Ventana cerrada (bloqueo '+hora(v.bloqueo)+')';
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  return 'Quedan '+h+'h '+m+'min para el bloqueo ('+hora(v.bloqueo)+')';
}

    <div class="sub">${J.etiqueta}</div>
    <h3 style="margin-top:2px">${s.ruta} · ${hora(s.salida)}</h3>

    ${mia?`<div style="margin-top:8px"><b>${esc(mia.parada)}</b><div class="sub">Paso estimado por tu punto: ${hora(paso.toISOString())}</div></div>`:''}

      <div><span class="sub">Capacidad</span><br><b>${D.confirmadas}/${D.capacidad}</b> ${D.capacidadExtra?`<span class="chip c-ambar">+${D.capacidadExtra} autorizados</span>`:''}
        <div class="barra"><i class="b-conf" style="width:${(D.confirmadas/Math.max(D.solicitudes,D.capacidad))*100}%"></i><i class="b-esp" style="width:${(D.espera/Math.max(D.solicitudes,D.capacidad))*100}%"></i></div>
        <div class="sub" style="margin-top:4px">${D.solicitudes} solicitudes · ${D.confirmadas} confirmadas · ${D.espera} en espera</div></div>
      <div style="text-align:right">
        ${mia?`<span class="chip ${ch.cls}">${ch.txt}</span>`
             :`<span class="chip c-gris">Sin reserva</span>`}
        <div class="sub" style="margin-top:5px">${vJ.estado==='ABIERTA'?cuentaRegresivaBloqueo(J.id):(vJ.estado==='BLOQUEADO_POR_CIERRE'?'Bloqueado por cierre de jornada':'Inscripción aún no abierta')}</div>

function creaSolicitud(sid){
  if(!requirePermission('crear:solicitud-extra',{tipo:'servicio'})){alert('No autorizado.');return;}
  const s=S.servicios.find(x=>x.id===sid); const N=nivelJustificacion(s);
  const motivo=document.getElementById('mMotivo').value.trim();
  const razon=document.getElementById('mRazon')?document.getElementById('mRazon').value:null;
  if(!motivo){alert('El motivo es obligatorio.');return;}
  if(!N.auto&&!razon){alert('Debes indicar una razón operacional.');return;}
  const vans=Number(document.getElementById('mVans').value);   // QA D-4: sin valor por defecto silencioso
  if(!Number.isInteger(vans)||vans<1||vans>S.contrato.vansExtraDisponibles){alert('Solo hay '+S.contrato.vansExtraDisponibles+' van(es) adicional(es) a disposición según contrato.');return;}   // SPEC-003 R6
  // SPEC-003b R7 (DEC-013): tope de vans extra por jornada nocturna, contando solicitudes no rechazadas
  const J=jornadaDe(s.salida).id;
  const usadas=S.extras.filter(e=>e.estado!=='Rechazado'&&jornadaDe(S.servicios.find(x=>x.id===e.servicioId).salida).id===J).reduce((a,e)=>a+e.vans,0);
  if(usadas+vans>S.contrato.vansExtraDisponibles){alert('Tope por jornada: ya hay '+usadas+' van(es) extra solicitada(s) en esta jornada; el contrato permite '+S.contrato.vansExtraDisponibles+'.');return;}
  const id=Math.max(0,...S.extras.map(e=>e.id))+1;
  S.extras.push({id,servicioId:sid,motivo:(razon?razon+' — ':'')+motivo,tipo:N.auto?'cuantitativa':'operacional',
    vans,capacidadExtra:vans*S.contrato.capacidadVan,tarifa:S.contrato.tarifaExtra*vans,estado:'Solicitado',
    solicitadoPor:S.sesion,fechaSolicitud:ahora().toISOString(),autorizadoPor:null,fechaAutorizacion:null,motivoAutorizacion:null,

const ORDEN=['Solicitado','En revisión','Autorizado','Despachado','Utilizado','Conciliado'];
const TRANS={'Solicitado':['En revisión','Rechazado'],'En revisión':['Autorizado','Rechazado'],'Autorizado':['Despachado'],
 'Despachado':['Utilizado','No utilizado'],'Utilizado':['Observado','Conciliado'],'No utilizado':['Observado','Conciliado'],
 'Observado':['Conciliado'],'Rechazado':[],'Conciliado':[]};
function respaldado(e){const aut=!!e.autorizadoPor||e.emergenciaValidada===true;
  return aut&&e.evidencia.patente&&e.evidencia.salida&&e.evidencia.manifiesto&&e.tarifa===S.contrato.tarifaExtra*e.vans;}
/* SPEC-002 R2: permiso exigido según el estado destino */
const PERMISO_ESTADO={'En revisión':'autorizar:extra','Autorizado':'autorizar:extra','Rechazado':'autorizar:extra','Observado':'autorizar:extra',
 'Despachado':'operar:extra','Utilizado':'operar:extra','No utilizado':'operar:extra','Conciliado':'conciliar:periodo'};
function transicion(e,nuevo,motivo,permiso){
  // Excepción explícita (R2): subsanación por el CONTRATISTA con registrar:evidencia, solo Observado → Conciliado y respaldado.
  const req=(permiso==='registrar:evidencia'&&nuevo==='Conciliado'&&e.estado==='Observado'&&respaldado(e))?permiso:PERMISO_ESTADO[nuevo];
  if(!requirePermission(req)) return {ok:false,error:'No autorizado'};
  if(!TRANS[e.estado].includes(nuevo)) return {ok:false,error:'Transición no permitida: '+e.estado+' → '+nuevo};
  if(nuevo==='Conciliado'&&e.estado==='Observado'&&!respaldado(e)&&!e.excluido)
    return {ok:false,error:'Un Observado solo se concilia subsanando la evidencia o excluyéndolo con motivo'};
  const ant=e.estado; e.estado=nuevo; audita('Extra #'+e.id+' → '+nuevo,motivo,ant); guardar(); return {ok:true};
}
function clasifica(e){
  if(e.reclasificacion) return e.reclasificacion;
  if(e.estado==='Rechazado') return '—';
  if(!e.autorizadoPor&&e.emergenciaValidada!==true&&['Utilizado','Observado'].includes(e.estado)) return 'Servicio sin respaldo suficiente';
  if(e.tipo==='operacional'&&e.emergenciaValidada===true) return 'Contingencia justificada';
  const o=div(e.pasajerosExtra,e.capacidadExtra);
  if(o==null) return e.estado==='No utilizado'?'Vehículo adicional sin utilización':'Pendiente de datos';
  if(o>=0.6) return 'Necesidad confirmada'; if(o>=0.25) return 'Necesidad parcialmente confirmada';
  if(o>0) return 'Vehículo adicional subutilizado'; return 'Vehículo adicional sin utilización';
}

const ADV=`<div class="advertencia"><b>Nota contractual</b>Los indicadores de costo por usuario y ocupación miden eficiencia operacional. No modifican el monto contractual salvo que el contrato establezca expresamente un ajuste.</div>`;
function periodo(){
  const svcMes=S.servicios.filter(s=>s.salida.startsWith(MES));
  const hasta=svcMes.filter(s=>s.ejecutado);
  const rsHasta=S.reservas.filter(r=>(r.estado==='confirmada'||r.estado==='CONFIRMADO')&&hasta.some(s=>s.id===r.servicioId));
  const capHasta=hasta.reduce((a,s)=>a+capacidadTotal(s),0);
  // proyección: 30 días × salidasPorJornada × rutas (DEC-032; no hardcode 420)
  const svcMesCompleto=30*S.contrato.salidasPorJornada*S.contrato.rutas.length;
  const factor=div(svcMesCompleto,hasta.length)||1;
  return {ejecutados:hasta.length,programados:svcMes.length,transportados:rsHasta.length,capacidad:capHasta,
    ocupacion:div(rsHasta.length,capHasta),cuposLibres:Math.max(capHasta-rsHasta.length,0),
    proy:{servicios:svcMesCompleto,pasajeros:Math.round(rsHasta.length*factor),
      ocupacion:div(rsHasta.length,capHasta),
      costoServicio:div(S.contrato.montoFijo,svcMesCompleto),
      costoPasajero:div(S.contrato.montoFijo,Math.round(rsHasta.length*factor))},
    valorTeorico:(div(S.contrato.montoFijo,capHasta)!=null)?div(S.contrato.montoFijo,capHasta)*Math.max(capHasta-rsHasta.length,0):null};
}
function extrasResumen(){
  const xs=S.extras;

  const resp=ejec.filter(e=>respaldado(e)&&!e.excluido);
  const obs=xs.filter(e=>e.estado==='Observado');
  return {solicitados:xs.length,autorizados:xs.filter(e=>e.autorizadoPor&&e.estado!=='Rechazado').length,
    rechazados:xs.filter(e=>e.estado==='Rechazado').length,ejecutados:ejec.length,observados:obs.length,
    montoPresentado:ejec.filter(e=>!e.excluido).reduce((a,e)=>a+(e.tarifa||0),0),
    montoRespaldado:resp.reduce((a,e)=>a+(e.tarifa||0),0),
    montoObservado:obs.filter(e=>!e.excluido).reduce((a,e)=>a+(e.tarifa||0),0)};
}

  if(!requirePermission('conciliar:periodo')){alert('No autorizado.');return;}
  const obs=S.extras.filter(e=>e.estado==='Observado').length;
  if(obs){alert('Resuelve los '+obs+' observado(s) para cerrar.');return;}   // SPEC-002 R4: regla en la función, no solo en el botón
  const X=extrasResumen(); const n=S.conciliaciones.length+1;
  const correlativo=S.contrato.codigoConciliacion+'-'+String(n).padStart(2,'0');
  S.conciliaciones.push({mes:MES,correlativo,fecha:ahora().toISOString(),fijo:S.contrato.montoFijo,
    respaldado:X.montoRespaldado,observado:X.montoObservado,total:S.contrato.montoFijo+X.montoRespaldado,cerradoPor:S.sesion});
  S.extras.forEach(e=>{if(['Utilizado','No utilizado'].includes(e.estado)&&respaldado(e))transicion(e,'Conciliado','Cierre del período');});
  audita('Período '+MES+' cerrado — '+correlativo,'Total '+fmt$(S.contrato.montoFijo+X.montoRespaldado),'abierto');
  guardar(); verDoc(correlativo);
}
function verDoc(correlativo){
  const c=S.conciliaciones.find(x=>x.correlativo===correlativo); const P=periodo();
  const resp=S.extras.filter(e=>respaldado(e)&&!e.excluido&&e.estado==='Conciliado');
  modal(`<div class="doc"><div class="cab"><div class="correl">Conciliación ${c.correlativo}</div>
   <span class="sub">Hotel Enjoy Antofagasta — Transportes del Desierto SpA · Período ${c.mes}</span></div>
   <table><tbody>
    <tr><td>Monto fijo del contrato</td><td class="n">${fmt$(c.fijo)}</td></tr>
    <tr><td>Servicios ejecutados hasta la fecha</td><td class="n">${P.ejecutados}</td></tr>
    ${resp.map(e=>`<tr><td>Extra #${e.id} — ${clasifica(e)}</td><td class="n">${fmt$(e.tarifa)}</td></tr>`).join('')}
    <tr class="tot"><td>Total del período</td><td class="n">${fmt$(c.total)}</td></tr>
   </tbody></table>
   <p class="sub" style="margin-top:10px">Indicador calculado sobre el valor contractual mensual completo. Los indicadores de eficiencia no modifican el monto contractual salvo regla expresa. Documento digital — sin firmas.</p></div>
   <div class="acciones"><button class="sec" onclick="cierraModal()">Cerrar</button></div>`);
}

  if(!requirePermission('ver:control-contractual')) return vDenegado();

  return `<h1>Contrato</h1><p class="sub">Fuente única de tarifas y condiciones.</p>

function vAuditoria(){
  const p=S.contexto==='CONTRATISTA'?'ver:trazabilidad-operacional':'ver:trazabilidad';
  if(!requirePermission(p)) return vDenegado();
  return `<h1>Trazabilidad</h1><p class="sub">Sesiones, decisiones, cambios de capacidad, accesos denegados — con usuario, rol, fecha y valor anterior.</p>
  <div class="tarjeta">${S.auditoria.slice(0,70).map(a=>`<div class="aud ${a.denegado?'denegado':''}"><b>${fecha(a.fecha)} ${hora(a.fecha)}</b> · ${esc(a.usuario)} (${esc(a.rol)}) — ${esc(a.accion)}${a.detalle?': '+esc(a.detalle):''}${a.anterior?' <span class="sub">(antes: '+esc(a.anterior)+')</span>':''}</div>`).join('')}</div>`;
}
/* ---------- ADMINISTRADOR ---------- */
function vAdmin(){
  if(!requirePermission('ver:administracion')) return vDenegado();
  return `<h1>Usuarios y roles</h1><p class="sub">Los roles se asignan aquí; ningún usuario puede elegir el suyo.</p>
  <div class="tarjeta"><table><thead><tr><th>Usuario</th><th>Organización</th><th>Roles asignados</th><th>Estado</th></tr></thead><tbody>
  ${S.users.map(u=>{const org=S.organizations.find(o=>o.id===u.orgId);const as=S.role_assignments.filter(a=>a.userId===u.id);
   return `<tr><td><b>${u.nombre}</b><br><span class="sub">${u.identificador} · ${u.email}</span></td><td>${org.nombre}</td>
    <td>${as.map(a=>`<span class="chip ${a.activo?'c-verde':'c-gris'}">${a.rol}${a.activo?'':' (inactivo)'}</span>`).join(' ')||'<span class="sub">sin rol</span>'}
     <div class="sub">${as.length?'asignado el '+as[0].fecha+' por '+(S.users.find(x=>x.id===as[0].asignadoPor)||{}).nombre:''}</div></td>
    <td><button class="sec" onclick="toggleUsuario(${u.id})">${u.activo?'Desactivar':'Activar'}</button></td></tr>`;}).join('')}
  </tbody></table></div>`;
}
function toggleUsuario(uid){
  if(!requirePermission('asignar:rol')){alert('No autorizado.');return;}
  const u=S.users.find(x=>x.id===uid); const a=u.activo; u.activo=!a;
  audita((u.activo?'Cuenta activada':'Cuenta desactivada'),u.nombre,''+a); guardar(); render();
}
function vEmpresas(){
  if(!requirePermission('ver:administracion')) return vDenegado();
  return `<h1>Empresas</h1><div class="tarjeta"><table><thead><tr><th>Organización</th><th>Tipo</th><th class="n">Usuarios</th></tr></thead><tbody>
  ${S.organizations.map(o=>`<tr><td><b>${o.nombre}</b></td><td><span class="chip c-azul">${o.tipo}</span></td><td class="n">${S.users.filter(u=>u.orgId===o.id).length}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function modal(html){document.getElementById('modal').innerHTML=html;document.getElementById('velo').classList.add('abierto');}
function cierraModal(){document.getElementById('velo').classList.remove('abierto');}
document.getElementById('velo').addEventListener('click',e=>{if(e.target.id==='velo')cierraModal();});

render();
